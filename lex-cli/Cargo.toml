[package]
name = "lex-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "lex"
path = "src/main.rs"

[dependencies]
lex-core = { path = "../lex-core" }
lex-data = { path = "../lex-data" }
anyhow = { workspace = true }
clap = { version = "4.6", features = ["derive"] }
thiserror = { workspace = true }
env_logger = "0.11"
log = { workspace = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
libc = "0.2"
rand = "0.10.3"
rand_chacha = "0.10.0"
time = { version = "0.3.55", features = ["formatting"] }

[dev-dependencies]
strum = { workspace = true }
