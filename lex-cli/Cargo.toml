[package]
name = "lex-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "lex"
path = "src/main.rs"

[[test]]
name = "tracks"
harness = false

[dependencies]
lex-core = { path = "../lex-core" }
lex-data = { path = "../lex-data" }
anyhow = { workspace = true }
clap = { version = "4.6", features = ["derive"] }
thiserror = { workspace = true }
strum = { workspace = true }
env_logger = "0.11"
log = { workspace = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
rand = "0.10.3"
rand_chacha = "0.10.0"
yaml_serde = "0.10.7"
time = { version = "0.3.55", features = ["formatting"] }

[dev-dependencies]
insta = { version = "1.49", features = ["json"] }
libtest-mimic = "0.8"
sha2 = "0.11.1"
tempfile = "3"

[lints]
workspace = true
