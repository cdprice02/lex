[package]
name = "lex-core"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = { workspace = true }
lex-data = { path = "../lex-data" }
log = { workspace = true }
strum = { workspace = true }
divan = { version = "0.1", optional = true }

[dev-dependencies]
proptest = { workspace = true }

[build-dependencies]
sha2 = "0.11.1"

[lib]
name = "lex_core"

[features]
bench = ["dep:divan"]

[[bench]]
name = "lex-core"
harness = false
required-features = ["bench"]
