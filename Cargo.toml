cargo-features = ["profile-rustflags"]

[workspace]
resolver = "3"

members = ["lex-core", "lex-cli", "lex-data"]

[workspace.dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
log = "0.4"
proptest = "1"
strum = { version = "0.26", features = ["derive"] }
thiserror = "2.0"

[workspace.lints.rust]
missing_docs = "warn"
non_exhaustive_omitted_patterns = "warn"
must_not_suspend = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
missing_docs_in_private_items = "warn"
# A deny never stops `cargo build`, `test` or `run`; the pre-commit hook and CI
# (which fail on warnings too) are what stop it.
unwrap_used = "deny"
# Paired with `unwrap_used`: `expect` panics on the same inputs. A site that
# cannot fail keeps the `expect` and states why through
# `#[expect(clippy::expect_used, reason = "...")]`; tests are exempt via
# `clippy.toml`.
expect_used = "deny"
panic = "deny"
exit = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
# Requires `#[expect]` in place of `#[allow]`: an expectation fails the build
# once its lint stops firing, so a suppression cannot outlive its reason.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
panic_in_result_fn = "deny"
unchecked_time_subtraction = "deny"
string_slice = "deny"
missing_assert_message = "deny"
wildcard_enum_match_arm = "deny"
as_conversions = "deny"

[profile.release]
lto = "fat"
opt-level = 3
rustflags = ["-C", "target-cpu=native"]

[profile.samply]
inherits = "release"
debug = true
lto = false
# opt-level = 0
rustflags = ["-C", "target-cpu=native", "-C", "force-frame-pointers=yes"]
