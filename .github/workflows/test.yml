name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # a named level: native artifacts in the shared rust-cache crash rustc on other runner CPUs
  CARGO_PROFILE_RELEASE_RUSTFLAGS: "-C target-cpu=x86-64-v3"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # installs the pin from rust-toolchain.toml
      - name: Install pinned toolchain
        run: rustup toolchain install
      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --locked --all
      - name: Bench smoke test
        run: cargo test --locked --workspace --all-features --benches
